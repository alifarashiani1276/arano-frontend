    <script>
      // اعمال Theme قبل از اولین Paint (جلوگیری از Flash)
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("arano:appearance") || "{}");
          var r = document.documentElement;
          var m =
            s.mode === "dark" || s.mode === "light"
              ? s.mode
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          r.dataset.mode = m;
          r.style.colorScheme = m;
          r.dataset.theme = /^[a-z]+$/.test(s.theme || "") ? s.theme : "arano";
        } catch (e) {}
      })();
    </script>
    <script>
      // لودینگ فقط برای «اولین ورود در هر نشست» و کوتاه نمایش داده می‌شود.
      // ربات‌ها (Googlebot، Lighthouse، ...)، حالت کاهش حرکت و بازدیدهای بعدیِ همان نشست
      // اصلاً لودینگ نمی‌بینند تا محتوای واقعی صفحه فوراً قابل دیدن و ایندکس باشد.
      (function () {
        var skip = false;
        try {
          skip =
            /bot|crawl|spider|slurp|lighthouse|pagespeed|headless|inspectiontool|bingpreview/i.test(
              navigator.userAgent,
            ) ||
            navigator.webdriver === true ||
            matchMedia("(prefers-reduced-motion: reduce)").matches ||
            sessionStorage.getItem("arano:seen") === "1";
        } catch (e) {}
        if (skip) {
          var r = document.documentElement;
          r.className = (r.className + " no-preloader").replace(
            "is-loading",
            "",
          );
        }
      })();
    </script>
    <!-- لودینگ ورود: همین‌جا (inline) است تا قبل از لود شدن JS هم دیده شود -->
    <style>
      html.is-loading,
      html.is-loading body {
        overflow: hidden;
      }
      html.no-preloader #preloader {
        display: none;
      }
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        color: #000;
        font-family: "Vazir", system-ui, sans-serif;
      }
      #preloader .pl-panel {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ccf802; /* رنگ برند آرانو */
        will-change: transform;
        transition: transform 0.2s cubic-bezier(0.76, 0, 0.24, 1);
      }
      /* لبه‌ی گرد پرده؛ هنگام بالا رفتن جلوتر از پرده حرکت می‌کند */
      #preloader .pl-curve {
        position: absolute;
        top: calc(
          100% - 1px
        ); /* ۱ پیکسل هم‌پوشانی تا خط ریز بین پرده و لبه دیده نشود */
        left: -10%;
        right: -10%;
        height: 14vh;
        background: #ccf802;
        border-radius: 0 0 50% 50% / 0 0 100% 100%;
      }
      #preloader .pl-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        animation: pl-in 0.12s ease-out backwards;
      }
      #preloader .pl-logo {
        position: relative;
        width: 72px;
        aspect-ratio: 857 / 526;
      }
      #preloader .pl-logo svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #preloader .pl-base {
        fill: rgba(0, 0, 0, 0.13);
      }
      /* لوگو از پایین به بالا با درصد لود پر می‌شود */
      #preloader .pl-fill {
        fill: #000;
        clip-path: inset(var(--top, 100%) 0 0 0);
      }
      #preloader .pl-count {
        display: flex;
        align-items: baseline;
        gap: 2px;
        direction: ltr;
        font-size: 13px;
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      /* خروج: محتوا محو می‌شود و پرده بالا می‌رود */
      #preloader.pl-exit .pl-panel {
        transform: translate3d(0, calc(-100% - 14vh), 0);
      }
      #preloader.pl-exit .pl-center {
        opacity: 0;
        transform: translate3d(0, -20px, 0);
        transition:
          opacity 0.12s ease,
          transform 0.2s cubic-bezier(0.76, 0, 0.24, 1);
      }
      #preloader.pl-fade {
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      @keyframes pl-in {
        from {
          opacity: 0;
          transform: translate3d(0, 24px, 0) scale(0.94);
        }
      }
    </style>
    <noscript

  <body>
    <div

      role="status"
      aria-live="polite"
      aria-label="در حال بارگذاری"

                />

    <div id="root">
      <!-- نماد اینماد: برای ربات‌های بررسی که جاوااسکریپت اجرا نمی‌کنند. React بعد از لود جایگزینش می‌کند. -->

    <script type="module" src="/src/main.jsx"></script>
    <script>
      // لودینگ کوتاه: حدود ۱۲۰ms پر شدن لوگو + ۲۰۰ms خروج (در مجموع کمتر از ~۳۵۰ms).
      // اگر صفحه تا ۱ ثانیه کامل لود نشود هم لودینگ بسته می‌شود (هیچ‌وقت گیر نمی‌کند).
      (function () {
        var el = document.getElementById("preloader");
        var root = document.documentElement;
        if (!el) return;

        function finish() {
          el.remove();
          root.classList.remove("is-loading");
          root.dataset.loaded = "true";
          try {
            sessionStorage.setItem("arano:seen", "1");
          } catch (e) {}
          dispatchEvent(new Event("arano:loaded"));
        }

        // ربات / کاهش حرکت / بازدید بعدی در همین نشست: بدون هیچ لودینگی
        if (root.classList.contains("no-preloader")) {
          finish();
          return;
        }

        var fill = el.querySelector(".pl-fill");
        var num = el.querySelector(".pl-num");
        var FILL = 120; // مدت پر شدن لوگو (ms)
        var MAX_WAIT = 1000; // حداکثر انتظار برای آماده شدن صفحه (ms)
        var start = performance.now();
        var ready = document.readyState === "complete";
        var last = -1;

        if (!ready) {
          addEventListener(
            "load",
            function () {
              ready = true;
            },
            { once: true },
          );
          setTimeout(function () {
            ready = true;
          }, MAX_WAIT);
        }

        function render(v) {
          var n = Math.round(v);
          if (n !== last) {
            last = n;
            num.textContent = n.toLocaleString("fa-IR");
          }
          fill.style.setProperty("--top", 100 - v + "%");
        }

        function close() {
          el.classList.add("pl-exit");
          setTimeout(finish, 200);
        }

        function frame(now) {
          var byTime = Math.min(100, ((now - start) / FILL) * 100);
          var p = ready ? byTime : Math.min(byTime, 88);
          render(p);
          if (p >= 100) close();
          else requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
